<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Icon Maker - LifeHub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0a0e1a;
      color: white;
      padding: 40px;
      text-align: center;
    }
    button {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
      font-weight: bold;
    }
    button:hover { transform: translateY(-2px); }
    canvas { margin: 20px; border-radius: 12px; }
    h1 { color: #ec4899; }
  </style>
</head>
<body>
  <h1>⚡ LifeHub Icon Maker</h1>
  <p>اضغط الزر لتحميل الأيقونات</p>

  <canvas id="c1" width="192" height="192"></canvas>
  <canvas id="c2" width="512" height="512"></canvas>

  <br>
  <button onclick="download(192)">📥 تحميل icon-192.png</button>
  <button onclick="download(512)">📥 تحميل icon-512.png</button>
  <button onclick="downloadAll()">⚡ تحميل الاثنين</button>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');

      // خلفية متدرجة
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#ec4899');
      grad.addColorStop(0.5, '#8b5cf6');
      grad.addColorStop(1, '#3b82f6');
      ctx.fillStyle = grad;

      // مربع بزوايا دائرية
      const r = size * 0.22;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();

      // ظل داخلي للعمق
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = size * 0.05;
      ctx.shadowOffsetY = size * 0.02;

      // الرمز ⚡
      ctx.fillStyle = 'white';
      ctx.font = 'bold ' + (size * 0.6) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⚡', size / 2, size / 2);
    }

    function download(size) {
      const canvas = size === 192 ? document.getElementById('c1') : document.getElementById('c2');
      const link = document.createElement('a');
      link.download = 'icon-' + size + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadAll() {
      download(192);
      setTimeout(function() { download(512); }, 500);
    }

    // رسم الأيقونات
    drawIcon(document.getElementById('c1'), 192);
    drawIcon(document.getElementById('c2'), 512);
  </script>
</body>
</html>
